# Every push to main rebuilds ghcr.io/<repo>:main, overwriting the previous
# one, for trying out unreleased code. Versioned images (and :latest) are
# release.yml's job.
name: main

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write # push to ghcr.io

concurrency:
  group: main-docker
  cancel-in-progress: true # only the newest commit's image matters

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Same date-hash format the binary computes itself, so clients notice
      # each new main image as a deploy and reload.
      - id: version
        run: echo "v=$(git log -1 --date=format-local:%Y-%m-%d --format=%cd)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
        env:
          TZ: UTC

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.v }}
          tags: ghcr.io/${{ github.repository }}:main
